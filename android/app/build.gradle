plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jindun.textchecker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jindun.textchecker'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 纯框架 API + ONNX Runtime（本地推理）；不申请 INTERNET 权限
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
}

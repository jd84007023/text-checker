  var HALF_PUNCT_AFTER_CJK = new RegExp('([' + CJK + '])\\s*([,;:?!])', 'g');
  // 3.3 英文省略号
  var THREE_DOTS = /\.{3,}|。{3,}/g;
  // 3.4 标点前多余空格
  var SPACE_BEFORE_PUNCT = /[ \t]+([，。、；：？！）」』》,.:;?!])/g;
  // 3.5 汉字之间连续空格
  var MULTI_SPACE = new RegExp('([' + CJK + ']) {2,}([' + CJK + '])', 'g');

  /* ============ 主检查函数 ============ */
  function checkText(text) {
    var issues = [];
    if (!text || !text.trim()) {
      return { issues: [], corrected: text || '', stats: { red: 0, gray: 0 } };
    }

    function push(i, len, orig, sug, level, type, msg, fixable) {
      issues.push({ index: i, length: len, original: orig, suggestion: sug,
        level: level, type: type, message: msg, fixable: fixable });
    }

    var m, re;

    // A. 错别字对
    TYPO_PAIRS.forEach(function (pair) {
      if (pair[0] === pair[1]) return; // 跳过占位
      var idx = 0;
      while ((idx = text.indexOf(pair[0], idx)) !== -1) {
        push(idx, pair[0].length, pair[0], pair[1], 'red', '错别字',
          '「' + pair[0] + '」应为「' + pair[1] + '」', true);
        idx += pair[0].length;
      }
    });

    // B. 以→已（动词前）
    re = new RegExp(YI_RE.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], '已' + m[1], 'red', '错别字',
        '「' + m[0] + '」应为「已' + m[1] + '」', true);
    }

    // C. 重复字词（红级）
    re = new RegExp(DUP_RED.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], m[0][0] + (m[0].length > 2 ? m[0][1] : ''), 'red', '重复用字',
        '「' + m[0] + '」疑似多打了一个「' + m[0][0] + '」', true);
    }

    // D. 重复标点
    re = new RegExp(REPEAT_PUNCT.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], m[0][0], 'gray', '标点重复',
        '「' + m[0] + '」重复标点，建议保留一个', true);
    }

    // E. 半角标点（中文语境）
    re = new RegExp(HALF_PUNCT_AFTER_CJK.source, 'g');
    var FULLMAP = { ',': '，', ';': '；', ':': '：', '?': '？', '!': '！' };
    while ((m = re.exec(text)) !== null) {
      push(m.index + m[1].length, m[2].length, m[2], FULLMAP[m[2]], 'gray', '标点混用',
        '中文语境建议使用全角「' + FULLMAP[m[2]] + '」', true);
    }

    // F. 英文省略号
    re = new RegExp(THREE_DOTS.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], '……', 'gray', '标点规范',
        '省略号应使用「……」', true);
    }

    // G. 标点前空格
    re = new RegExp(SPACE_BEFORE_PUNCT.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], m[1], 'gray', '多余空格',
        '标点前不应有空格', true);
    }

    // H. 汉字间连续空格
    re = new RegExp(MULTI_SPACE.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index + 1, m[0].length - 2, m[0].slice(1, -1), '', 'gray', '多余空格',
        '汉字之间连续空格，建议删除', true);
    }

    // I. 重复二字词（灰级，可能为叠词修辞，不自动修）
    re = new RegExp(DUP_GRAY.source, 'g');
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], m[0].slice(0, m[0].length / 2), 'gray', '疑似重复',
        '「' + m[0] + '」疑似重复（如为刻意叠词可忽略）', false);
    }

    // I2. 疑似拼音邻近误打：「这狗/那狗」多为「这个/那个」（若真在说狗可忽略）
    re = /([这那])狗/g;
    while ((m = re.exec(text)) !== null) {
      push(m.index, m[0].length, m[0], m[1] + '个', 'gray', '疑似误打',
        '「' + m[0] + '」如果是「' + m[1] + '个」的误打请修改；若确实在说狗可忽略', false);
    }

    // J. 成对标点不闭合（灰级提示）
    var pairs = [['“', '”', '引号'], ['（', '）', '括号'], ['《', '》', '书名号'], ['（', '）', '括号']];
    var seen = {};
    pairs.forEach(function (p) {
      if (seen[p[0]]) return;
      seen[p[0]] = true;
      var open = (text.match(new RegExp('\\' + p[0], 'g')) || []).length;
      var close = (text.match(new RegExp('\\' + p[1], 'g')) || []).length;
      if (open !== close) {
        push(0, 0, p[0] + p[1], '', 'gray', '标点不闭合',
          p[2] + p[0] + p[1] + ' 数量不匹配（' + open + ' 个' + p[0] + '，' + close + ' 个' + p[1] + '），请检查', false);
      }
    });

    // 排序 + 去重叠（红优先）
    issues.sort(function (a, b) { return a.index - b.index || (a.level === 'red' ? -1 : 1); });
    var accepted = [], occupied = [];
    issues.forEach(function (iss) {
      if (iss.type === '标点不闭合') { accepted.push(iss); return; }
      var overlap = occupied.some(function (r) {
        return iss.index < r[1] && r[0] < iss.index + iss.length;
      });
      if (!overlap) {
        accepted.push(iss);
        if (iss.fixable) occupied.push([iss.index, iss.index + iss.length]);
      }
    });

    // 生成修正文本：从后往前应用可自动修复项
    var corrected = text;
    accepted.filter(function (i) { return i.fixable; })
      .sort(function (a, b) { return b.index - a.index; })
      .forEach(function (iss) {
        corrected = corrected.slice(0, iss.index) + iss.suggestion + corrected.slice(iss.index + iss.length);
      });

    var stats = {
      red: accepted.filter(function (i) { return i.level === 'red'; }).length,
      gray: accepted.filter(function (i) { return i.level === 'gray'; }).length
    };
    return { issues: accepted, corrected: corrected, stats: stats };
  }

  /* 暴露给测试的规则表（用于单测统计） */
  function getStats() {
    return { typoPairs: TYPO_PAIRS.filter(function (p) { return p[0] !== p[1]; }).length };
  }

  return { checkText: checkText, getStats: getStats };
}));

</script>

<body>
<h1>文字检查器</h1>
<div class="sub">完全离线 · 输入完毕自动检查 · 红色=确定问题 灰色=建议 绿色=没问题</div>

<textarea id="input" placeholder="把微信里写好的话粘贴到这里，点「检查」"></textarea>
<div class="btnrow">
  <button class="btn-main" onclick="doCheck(true)">立即检查</button>
  <button class="btn-ai" id="btnCloud" onclick="doCloudCheck()" style="display:none">云端检查</button>
  <button class="btn-ai" id="btnAi" onclick="doAiCheck()" style="display:none">本地AI</button>
  <button class="btn-sec" onclick="doClear()">清空</button>
</div>
<div id="result" class="result"></div>
<div id="aiBox" class="result"></div>

<div class="footer">红=确定有问题，灰=建议看看（可忽略）<br>
修正后文本在「一键修正」下方，点「复制修正文本」再回微信粘贴</div>

<script>
var latestCorrected = '';
var debounceTimer = null;

/* 自动检查：停止输入 400ms 后触发（引擎耗时 <5ms，无性能压力） */
document.getElementById('input').addEventListener('input', function(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(function(){ doCheck(false); }, 400);
});
/* 粘贴立即检查 */
document.getElementById('input').addEventListener('paste', function(){
  clearTimeout(debounceTimer);
  setTimeout(function(){ doCheck(false); }, 50);
});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function doCheck(manual){
  var text = document.getElementById('input').value;
  var box = document.getElementById('result');
  if(!text.trim()){ box.innerHTML=''; return; }
  var t0 = performance.now();
  var r = TextChecker.checkText(text);
  var ms = Math.round(performance.now()-t0);
  latestCorrected = r.corrected;

  var html = '';
  if(r.issues.length === 0){
    html = '<div class="banner green">✓ 检查通过，没有发现问题（'+ms+'ms）</div>' +
           '<div class="summary">检查了 '+text.length+' 个字符</div>';
  } else {
    html += '<div class="summary">发现 '+r.stats.red+' 个确定问题、'+r.stats.gray+' 个建议项 · 耗时 '+ms+'ms</div>';
    // 高亮预览
    var segs = [], pos = 0;
    r.issues.filter(function(i){return i.length>0;}).forEach(function(i){
      if(i.index > pos) segs.push({t:'n', s:text.slice(pos, i.index)});
      segs.push({t:i.level, s:text.substr(i.index, i.length)});
      pos = i.index + i.length;
    });
    if(pos < text.length) segs.push({t:'n', s:text.slice(pos)});
    var hl = segs.map(function(s){
      return s.t==='n' ? esc(s.s) :
        (s.t==='red' ? '<span class="hl-red">'+esc(s.s)+'</span>' : '<span class="hl-gray">'+esc(s.s)+'</span>');
    }).join('');
    html += '<div class="highlight-box">'+hl+'</div>';

    // 红在前灰在后
    r.issues.slice().sort(function(a,b){return a.level===b.level?0:(a.level==='red'?-1:1);}).forEach(function(i){
      if(i.type === '标点不闭合'){
        html += '<div class="issue gray"><span class="tag gray">提示</span><span class="tag">'+esc(i.type)+'</span>'+
                '<div class="msg">'+esc(i.message)+'</div></div>';
        return;
      }
      var body = i.length>0
        ? '<span class="orig">'+esc(i.original)+'</span>&rarr;<span class="sug">'+esc(i.suggestion||'(删除)')+'</span>'
        : '<span class="sug">'+esc(i.suggestion)+'</span>';
      html += '<div class="issue '+i.level+'">'+
        '<span class="tag '+i.level+'">'+(i.level==='red'?'问题':'建议')+'</span>'+
        '<span class="tag">'+esc(i.type)+'</span>'+
        (i.fixable?'<span class="tag fix">可自动修</span>':'')+
        '<div style="margin-top:6px">'+body+'</div>'+
        '<div class="msg">'+esc(i.message)+'</div></div>';
    });
    if(r.stats.gray > 0){
      html += '<div class="btnrow"><button class="btn-main" onclick="doFix()">一键修正（红+灰可修项）</button></div>';
    }
    // 无论有无问题，都提供复制（修正后）文本入口
    if(r.issues.length > 0){
      html += '<div class="btnrow" style="margin-top:0"><button class="btn-copy" onclick="doCopy()">复制修正文本</button></div>';
    }
  }
  box.innerHTML = html;
}

function doCopy(){
  var text = latestCorrected || document.getElementById('input').value;
  if(!text) return;
  function ok(){ alert('已复制，请回微信粘贴'); }
  if(window.AndroidBridge && window.AndroidBridge.copy){
    window.AndroidBridge.copy(text); ok(); return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(function(){ fallbackCopy(text, ok); });
  } else { fallbackCopy(text, ok); }
}
function fallbackCopy(text, ok){
  var ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy');
  document.body.removeChild(ta); ok();
}

function doFix(){
  document.getElementById('input').value = latestCorrected;
  doCheck();
  window.scrollTo({top:0, behavior:'smooth'});
}

function doClear(){
  document.getElementById('input').value='';
  document.getElementById('result').innerHTML='';
}

/* 长按复制场景：剪贴板有内容时自动填入（手机端省一步） */
if(navigator.clipboard && navigator.clipboard.readText){
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && !document.getElementById('input').value){
      navigator.clipboard.readText().then(function(t){
        if(t && t.trim()) document.getElementById('input').value = t;
      }).catch(function(){ /* 无权限则忽略 */ });
    }
  });
}

/* ================= 本地 AI 检查（仅 Android 桥存在时可用） ================= */
var aiIssues = [];

/* Kotlin 推理完成后调用：json = [{original, suggestion, index}] */
window.receiveAi = function(json){
  try { aiIssues = JSON.parse(json) || []; } catch(e){ aiIssues = []; }
  doCheck(false);            /* 重跑本地规则（文本可能已含改动则由前端另处理） */
  renderAi();
  if(window.AndroidBridge && window.AndroidBridge.aiDone){
    window.AndroidBridge.aiDone();
  }
};

function doAiCheck(){
  if(!(window.AndroidBridge && window.AndroidBridge.runAi)){
    alert('本地AI引擎不可用'); return;
  }
  var text = document.getElementById('input').value;
  if(!text.trim()){ alert('请先输入要检查的文字'); return; }
  aiIssues = [];
  document.getElementById('aiBox').innerHTML =
    '<div class="ai-wait">本地AI检查中，约需 1 秒…</div>';
  /* 文本须经 JSON 桥传输：交给 Kotlin 侧编码后回传再执行，避免引号注入 */
  window.AndroidBridge.runAi(text);
}

function renderAi(){
  var box = document.getElementById('aiBox');
  if(!aiIssues.length){
    box.innerHTML = '<div class="banner green">✓ AI 检查通过，没有发现音近词/语病问题</div>';
    return;
  }
  var html = '<div class="summary">AI 发现 '+aiIssues.length+' 处疑似错误（蓝色，需你确认后采纳）</div>';
  aiIssues.forEach(function(i, idx){
    html += '<div class="issue blue">'+
      '<span class="tag blue">AI建议</span>'+
      '<span class="tag">疑似错字</span>'+
      '<div style="margin-top:6px"><span class="orig">'+esc(i.original)+'</span>&rarr;'+
      '<span class="sug blue">'+esc(i.suggestion)+'</span></div>'+
      '<div class="msg">位置：第 '+(i.index+1)+' 字</div>'+
      '<div class="btnrow" style="margin:8px 0 0"><button class="btn-ai" onclick="applyAi('+idx+')">采纳</button></div>'+
      '</div>';
  });
  box.innerHTML = html;
}

function applyAi(idx){
  var item = aiIssues[idx];
  if(!item) return;
  var input = document.getElementById('input');
  var text = input.value;
  if(text.substr(item.index, item.original.length) !== item.original){
    alert('文本已变化，请重新检查后再采纳'); return;
  }
  input.value = text.slice(0, item.index) + item.suggestion + text.slice(item.index + item.original.length);
  aiIssues.splice(idx, 1);
  doCheck(false);
  renderAi();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* 仅 Android 桥可用时显示 AI 按钮；网页版隐藏 */
if(window.AndroidBridge && window.AndroidBridge.runAi){
  document.getElementById('btnAi').style.display = '';
}
if(window.AndroidBridge && window.AndroidBridge.runCloud){
  document.getElementById('btnCloud').style.display = '';
}

/* ================= 云端检查（免费模型，OpenAI 兼容） ================= */
var cloudResult = null;

function doCloudCheck(){
  if(!(window.AndroidBridge && window.AndroidBridge.runCloud)){
    alert('云端检查仅在手机 App 内可用'); return;
  }
  var text = document.getElementById('input').value;
  if(!text.trim()){ alert('请先输入要检查的文字'); return; }
  document.getElementById('aiBox').innerHTML =
    '<div class="ai-wait">云端 AI 检查中…（首次或网络慢时约数秒）</div>';
  window.AndroidBridge.runCloud(text);
}

/* Kotlin 回传：{"corrected":"...","issues":[{original,suggestion,reason}],"error":"..."} */
window.receiveCloud = function(json){
  var box = document.getElementById('aiBox');
  try { cloudResult = JSON.parse(json); } catch(e){ cloudResult = {error:'返回解析失败'}; }
  if(cloudResult.error){
    box.innerHTML = '<div class="issue red"><span class="tag red">失败</span>'+
      '<div class="msg">'+esc(String(cloudResult.error))+'</div></div>';
    return;
  }
  renderCloud();
};

function renderCloud(){
  var box = document.getElementById('aiBox');
  var r = cloudResult;
  if(!r) return;
  var issues = r.issues || [];
  var text = document.getElementById('input').value;
  var changed = r.corrected && r.corrected !== text;
  var html = '';
  if(!issues.length && !changed){
    box.innerHTML = '<div class="banner green">✓ 云端 AI 检查通过，没有发现错字或语病</div>';
    return;
  }
  html += '<div class="summary">云端 AI 发现 '+issues.length+' 处问题'+(changed?'（另有全文修正）':'')+'</div>';
  issues.forEach(function(i){
    html += '<div class="issue blue">'+
      '<span class="tag blue">AI</span>'+
      '<div style="margin-top:6px"><span class="orig">'+esc(i.original||'')+'</span>&rarr;'+
      '<span class="sug blue">'+esc(i.suggestion||'')+'</span></div>'+
      (i.reason?'<div class="msg">'+esc(i.reason)+'</div>':'')+
      '</div>';
  });
  if(changed){
    html += '<div class="issue blue"><span class="tag blue">AI</span><span class="tag">修正全文</span>'+
      '<div class="highlight-box" style="margin-top:8px">'+esc(r.corrected)+'</div>'+
      '<div class="btnrow" style="margin:8px 0 0"><button class="btn-ai" onclick="applyCloud()">采用修正全文</button></div></div>';
  }
  box.innerHTML = html;
}

function applyCloud(){
  if(!cloudResult || !cloudResult.corrected) return;
  document.getElementById('input').value = cloudResult.corrected;
  cloudResult = null;
  aiIssues = [];
  doCheck(false);
  document.getElementById('aiBox').innerHTML = '<div class="banner green">✓ 已采用云端修正文本</div>';
